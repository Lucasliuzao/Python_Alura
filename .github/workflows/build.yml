name: CI Pipeline

on:
  push:
    branches:
      - release
      - hml
      - uat
      - develop
  pull_request:
    branches:
      - release
      - hml
      - uat
      - develop

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Finalizar build
        run: echo "✅ Build executado com sucesso!"

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Rodar testes
        run: |
          echo "Executando testes automatizados..."
          pytest || echo "Nenhum teste encontrado"

  deploy-uat:
    name: deploy-uat
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/uat'
    steps:
      - name: Simular deploy no ambiente UAT
        run: |
          echo "Deploy no ambiente UAT executado com sucesso!"

  deploy-hml:
    name: deploy-hml
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/hml'
    steps:
      - name: Simular deploy no ambiente HML
        run: echo "Deploy no ambiente HML executado com sucesso!"

  deploy-release:
    name: deploy-release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/release'
    steps:
      - name: Simular deploy no ambiente producao
        run: echo "Deploy no ambiente de produção executado com sucesso!"